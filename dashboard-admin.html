<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Los Robles – Panel de Administración</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <!-- ========== ENCABEZADO FIJO ========== -->
  <header class="dashboard-header">
    <div class="header-top">
      <div class="header-info">
        <span class="header-logo">🏘️</span>
        <div class="header-textos">
          <!-- admin.js llena estos campos con el nombre real del admin -->
          <h1 id="nombreUsuario">Cargando...</h1>
          <p id="tipoUsuario">Administrador · Mesa Directiva</p>
        </div>
      </div>
      <button class="btn-cerrar-sesion" id="btnCerrarSesion">
        🚪 Cerrar sesión
      </button>
    </div>

    <!-- Menú de navegación entre secciones -->
    <nav class="header-nav">
      <button class="nav-btn activo" id="btn-resumen"
              onclick="mostrarSeccion('resumen')">
        📊 Resumen financiero
      </button>
      <button class="nav-btn" id="btn-vecinos"
              onclick="mostrarSeccion('vecinos')">
        👥 Vecinos
      </button>
      <button class="nav-btn" id="btn-emergencias"
              onclick="mostrarSeccion('emergencias')">
        🆘 Emergencias
      </button>
    </nav>
  </header>

  <!-- ========== CONTENIDO PRINCIPAL ========== -->
  <main class="dashboard-contenido">

    <!-- SECCIÓN 1: Resumen financiero (US-004) -->
    <!-- admin.js genera el contenido de esta sección -->
    <section class="seccion" id="sec-resumen"></section>

    <!-- SECCIÓN 2: Lista de vecinos y estado de pagos (US-002) -->
    <section class="seccion" id="sec-vecinos" style="display:none;"></section>

    <!-- SECCIÓN 3: Directorio de emergencias (US-005) -->
    <section class="seccion" id="sec-emergencias" style="display:none;"></section>

  </main>

  <!-- Scripts: el orden importa -->
  <script src="js/datos.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>

</body>
</html>
