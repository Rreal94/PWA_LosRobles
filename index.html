    // Componente Login
    function Login({ usuarios, onLogin }) {
      const [correo, setCorreo] = useState('rosa@losrobles.mx');
      const [password, setPassword] = useState('losrobles123');
      const [error, setError] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        const user = usuarios.find(u => u.correo.toLowerCase() === correo.trim().toLowerCase() && u.password === password);
        if (!user) {
          setError('Credenciales incorrectas.');
          return;
        }
        onLogin(user);
      };

      return (
        <div className="login-pagina">
          <div className="login-card">

              <span className="icono-app">🏘️</span>

                  <label>Correo electrónico</label>

                </div>
                <div className="campo">
                  <label>Contraseña</label>
                  <input type="password" value={password} onChange={e => setPassword(e.target.value)} required />

    // Componente PagoCuotas con generador de PDF (US-003 refinada)
    function PagoCuotas({ usuario, pagos, onRegistrarPago }) {
      const [metodo, setMetodo] = useState('Transferencia SPEI');
      const [folio, setFolio] = useState('');
      const pagoActual = pagos.find(p => p.usuarioId === usuario.id && p.mes === 'Octubre 2026');

      const handlePagar = (e) => {
        e.preventDefault();
        const ref = folio.trim() || `SPEI-${Date.now().toString().slice(-6)}`;
        const nuevoPago = {
          id: Date.now(),
          usuarioId: usuario.id,
          nombre: usuario.nombre,
          vivienda: usuario.vivienda,
          monto: 500,
          fecha: new Date().toISOString().split('T')[0],
          mes: 'Octubre 2026',
          referencia: ref,
          metodo: metodo
        };
        onRegistrarPago(nuevoPago);
      };

      const descargarPDF = (pago) => {
        if (window.jspdf && window.jspdf.jsPDF) {
          const doc = new window.jspdf.jsPDF();
          doc.setFillColor(31, 78, 120);
          doc.rect(0, 0, 210, 35, 'F');
          doc.setTextColor(255, 255, 255);
          doc.setFontSize(18);
          doc.text("RESIDENCIAL LOS ROBLES", 105, 18, { align: 'center' });
          doc.setFontSize(11);
          doc.text("Comprobante Oficial de Pago de Cuota de Mantenimiento", 105, 27, { align: 'center' });

          doc.setTextColor(33, 33, 33);
          doc.setFontSize(11);
          doc.text(`Folio Oficial: ${pago.referencia}`, 20, 50);
          doc.text(`Fecha de Emisión: ${pago.fecha}`, 140, 50);
          doc.line(20, 55, 190, 55);

          doc.text("DATOS DEL RESIDENTE:", 20, 65);
          doc.setFontSize(10);
          doc.text(`Nombre del Residente: ${pago.nombre}`, 25, 75);
          doc.text(`Ubicación de Vivienda: ${pago.vivienda}`, 25, 83);
          doc.text(`Periodo Correspondiente: ${pago.mes}`, 25, 91);
          doc.text(`Método de Pago: ${pago.metodo}`, 25, 99);

          doc.setFillColor(240, 244, 248);
          doc.rect(20, 110, 170, 30, 'F');
          doc.setFontSize(12);
          doc.setTextColor(17, 85, 204);
          doc.text(`MONTO PAGADO: $${pago.monto}.00 MXN`, 105, 125, { align: 'center' });
          doc.setFontSize(9);
          doc.setTextColor(100, 116, 139);
          doc.text("(Quinientos pesos 00/100 M.N. — Cuota mensual ordinaria)", 105, 133, { align: 'center' });

          doc.setTextColor(33, 33, 33);
          doc.setFontSize(9);
          doc.text("__________________________________________", 105, 175, { align: 'center' });
          doc.text("Doña Laura Sánchez — Tesorera de la Mesa Directiva", 105, 182, { align: 'center' });
          doc.text("Colonia Residencial Los Robles · Zapopan, Jalisco", 105, 188, { align: 'center' });

          doc.save(`Recibo_${pago.vivienda.replace(' ', '_')}_Octubre_2026.pdf`);
        } else {
          alert(`Comprobante generado: Folio ${pago.referencia}`);
        }
      };

      const misPagos = pagos.filter(p => p.usuarioId === usuario.id);

      return (
        <div className="modulo-pago">
          <div className="card-seccion">
            <div className="card-header">
              <h2>💳 Módulo de Pago de Cuota (US-003 Refinada)</h2>
              <span className="badge-sprint">Sprint 2 · React 18</span>
            </div>

            {pagoActual ? (
              <div className="alerta-exito">
                <div style={{ fontSize: '28px' }}>✅</div>
                <div>
                  <h3>¡Tu cuota de Octubre 2026 está pagada!</h3>
                  <p>Monto cubierto: <strong>$500.00 MXN</strong> | Folio: <code>{pagoActual.referencia}</code></p>
                  <button className="btn-secundario" style={{ marginTop: '10px' }} onClick={() => descargarPDF(pagoActual)}>
                    📄 Descargar Recibo Oficial en PDF
                  </button>
                </div>
              </div>
            ) : (
              <form onSubmit={handlePagar} style={{ marginTop: '16px' }}>
                <div className="resumen-cobro">
                  <div><span>Periodo:</span><strong>Octubre 2026</strong></div>
                  <div><span>Vivienda:</span><strong>{usuario.vivienda}</strong></div>
                  <div><span>Cuota ordinaria:</span><strong className="monto-destacado">$500.00 MXN</strong></div>
                </div>
                <div className="campo">
                  <label>Método de pago</label>
                  <select value={metodo} onChange={e => setMetodo(e.target.value)}>
                    <option value="Transferencia SPEI">Transferencia SPEI (BBVA / STP)</option>
                    <option value="Tarjeta de Débito/Crédito">Tarjeta Débito/Crédito en línea</option>
                    <option value="Efectivo en Administración">Efectivo en Administración</option>
                  </select>
                </div>
                <div className="campo">
                  <label>Folio bancario (Opcional)</label>
                  <input type="text" value={folio} onChange={e => setFolio(e.target.value)} placeholder="Ej. SPEI-984321" />
                </div>
                <button type="submit" className="btn-primario">Confirmar y Pagar $500.00 MXN →</button>
              </form>
            )}
          </div>

          <div className="card-seccion" style={{ marginTop: '20px' }}>
            <h3>📜 Historial de Cuotas</h3>
            <table className="tabla-registros">
              <thead>
                <tr><th>Periodo</th><th>Fecha</th><th>Método</th><th>Folio</th><th>Monto</th><th>Acción</th></tr>
              </thead>
              <tbody>
                {misPagos.map(p => (
                  <tr key={p.id}>
                    <td><strong>{p.mes}</strong></td>
                    <td>{p.fecha}</td>
                    <td>{p.metodo}</td>
                    <td><code>{p.referencia}</code></td>
                    <td><span className="badge-verde">${p.monto}.00</span></td>
                    <td><button className="btn-link" onClick={() => descargarPDF(p)}>📄 Recibo PDF</button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // Componente Tablón de Avisos (US-006 adelantada)
    function TablonAvisos({ usuario, avisos, onPublicarAviso }) {
      const [mostrarForm, setMostrarForm] = useState(false);
      const [titulo, setTitulo] = useState('');
      const [prioridad, setPrioridad] = useState('Media');
      const [contenido, setContenido] = useState('');

      const esAdmin = usuario && usuario.tipo === 'admin';

      const handleSubmit = (e) => {
        e.preventDefault();
        onPublicarAviso({
          id: Date.now(),
          titulo: titulo.trim(),
          autor: `${usuario.nombre} (${usuario.cargo || 'Directiva'})`,
          fecha: new Date().toISOString().split('T')[0],
          prioridad: prioridad,
          contenido: contenido.trim()
        });
        setTitulo('');
        setContenido('');
        setMostrarForm(false);
      };

      return (
        <div className="modulo-avisos">
          <div className="card-seccion">
            <div className="card-header" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <div>
                <h2>📢 Tablón de Avisos Oficiales (US-006)</h2>
                <p style={{ margin: '4px 0 0 0', color: '#64748B', fontSize: '13px' }}>
                  Comunicados de Don Pedro y la Mesa Directiva para Los Robles
                </p>
              </div>
              {esAdmin && (
                <button className="btn-primario" style={{ padding: '8px 14px', fontSize: '13px' }} onClick={() => setMostrarForm(!mostrarForm)}>
                  {mostrarForm ? '✕ Cancelar' : '➕ Publicar Aviso'}
                </button>
              )}
            </div>

            {esAdmin && mostrarForm && (
              <form onSubmit={handleSubmit} style={{ margin: '16px 0', padding: '16px', background: '#F8FAFC', borderRadius: '8px', border: '1px solid #E2E8F0' }}>
                <div className="campo">
                  <label>Título del comunicado</label>
                  <input type="text" value={titulo} onChange={e => setTitulo(e.target.value)} required />
                </div>
                <div className="campo">
                  <label>Prioridad</label>
                  <select value={prioridad} onChange={e => setPrioridad(e.target.value)}>
                    <option value="Alta">🔴 Alta (Urgente)</option>
                    <option value="Media">🟡 Media (Informativo)</option>
                    <option value="Baja">🟢 Baja (General)</option>
                  </select>
                </div>
                <div className="campo">
                  <label>Contenido</label>
                  <textarea rows="3" value={contenido} onChange={e => setContenido(e.target.value)} required></textarea>
                </div>
                <button type="submit" className="btn-primario">Publicar en Tablón →</button>
              </form>
            )}

            <div style={{ display: 'flex', flexDirection: 'column', gap: '12px', marginTop: '16px' }}>
              {avisos.map(a => (
                <div key={a.id} style={{ padding: '16px', background: '#FFFFFF', border: '1px solid #E2E8F0', borderLeft: a.prioridad === 'Alta' ? '4px solid #DC2626' : a.prioridad === 'Media' ? '4px solid #F59E0B' : '4px solid #10B981', borderRadius: '6px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                    <h3 style={{ margin: 0, fontSize: '16px', color: '#1E293B' }}>{a.titulo}</h3>
                    <span style={{ fontSize: '11px', padding: '2px 8px', borderRadius: '12px', fontWeight: 'bold', background: a.prioridad === 'Alta' ? '#FEE2E2' : '#FEF3C7', color: a.prioridad === 'Alta' ? '#991B1B' : '#92400E' }}>
                      Prioridad {a.prioridad}
                    </span>
                  </div>
                  <p style={{ margin: '8px 0', fontSize: '14px', color: '#475569', lineHeight: '1.4' }}>{a.contenido}</p>
                  <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '12px', color: '#94A3B8' }}>
                    <span>✍️ {a.autor}</span>
                    <span>📅 {a.fecha}</span>
                  </div>
                </div>
              ))}
            </div>

      );

          estatus: 'Reportado',

            </div>

            {mostrarForm && (
              <form onSubmit={handleSubmit} style={{ margin: '16px 0', padding: '16px', background: '#F8FAFC', borderRadius: '8px', border: '1px solid #E2E8F0' }}>
                <div className="campo">
                  <label>Título de la falla</label>
                  <input type="text" value={titulo} onChange={e => setTitulo(e.target.value)} required />
                </div>
                <div className="campo">
                  <label>Categoría</label>
                  <select value={categoria} onChange={e => setCategoria(e.target.value)}>
                    <option value="Alumbrado público">💡 Alumbrado público</option>
                    <option value="Acceso y Seguridad">🚪 Portón eléctrico y caseta</option>
                    <option value="Agua y Drenaje">💧 Agua y drenaje</option>
                    <option value="Áreas verdes">🌳 Jardinería y juegos</option>
                  </select>
                </div>
                <div className="campo">
                  <label>Descripción del problema</label>
                  <textarea rows="3" value={descripcion} onChange={e => setDescripcion(e.target.value)} required></textarea>
                </div>
                <button type="submit" className="btn-primario">Registrar Reporte →</button>
              </form>
            )}

            <div style={{ display: 'flex', flexDirection: 'column', gap: '12px', marginTop: '16px' }}>
              {fallas.map(f => (
                <div key={f.id} style={{ padding: '14px', background: '#FFFFFF', border: '1px solid #E2E8F0', borderRadius: '6px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                    <h4 style={{ margin: 0, color: '#0F172A', fontSize: '15px' }}>{f.titulo}</h4>
                    <span style={{ fontSize: '11px', padding: '2px 8px', borderRadius: '12px', fontWeight: 'bold', background: f.estatus === 'Resuelto' ? '#DCFCE7' : '#FEF3C7', color: f.estatus === 'Resuelto' ? '#166534' : '#92400E' }}>
                      ● {f.estatus}
                    </span>
                  </div>
                  <p style={{ margin: '6px 0', fontSize: '13.5px', color: '#475569' }}>{f.descripcion}</p>
                  <div style={{ fontSize: '12px', color: '#94A3B8' }}>
                    📂 {f.categoria} · 👤 {f.reportante} · 📅 {f.fecha}
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // Componente Dashboard Admin
    function DashboardAdmin({ usuario, usuarios, pagos }) {
      const vecinos = usuarios.filter(u => u.tipo === 'vecino');
      const pagosOctubre = pagos.filter(p => p.mes === 'Octubre 2026');
      const totalRecaudado = pagosOctubre.reduce((acc, p) => acc + p.monto, 0);

      return (
        <div className="dashboard-admin">
          <div className="tarjeta-bienvenida">
            <h2>Panel de la Mesa Directiva 👔</h2>
            <p>Bienvenido, <strong>{usuario.nombre}</strong> ({usuario.cargo}) · Residencial Los Robles</p>
          </div>

          <div className="grid-resumen" style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: '16px', margin: '20px 0' }}>
            <div className="card-kpi" style={{ background: '#FFFFFF', border: '1px solid #E2E8F0', padding: '16px', borderRadius: '8px' }}>
              <span style={{ fontSize: '11px', color: '#64748B', textTransform: 'uppercase', fontWeight: 'bold' }}>Recaudación Octubre</span>
              <div style={{ fontSize: '26px', fontWeight: 'bold', margin: '6px 0', color: '#166534' }}>
                ${totalRecaudado.toLocaleString()} MXN
              </div>
              <span style={{ fontSize: '12px', color: '#64748B' }}>Meta: ${(vecinos.length * 500).toLocaleString()} MXN</span>
            </div>

            <div className="card-kpi" style={{ background: '#FFFFFF', border: '1px solid #E2E8F0', padding: '16px', borderRadius: '8px' }}>
              <span style={{ fontSize: '11px', color: '#64748B', textTransform: 'uppercase', fontWeight: 'bold' }}>Vecinos al Corriente</span>
              <div style={{ fontSize: '26px', fontWeight: 'bold', margin: '6px 0', color: '#1E293B' }}>
                {pagosOctubre.length} / {vecinos.length} Casas
              </div>
              <span style={{ fontSize: '12px', color: '#16A34A' }}>Cuotas confirmadas</span>
            </div>
          </div>

          <div className="card-seccion">
            <h3>📋 Padrón de Residentes y Estatus de Cuotas</h3>
            <table className="tabla-registros">
              <thead>
                <tr><th>Vivienda</th><th>Residente</th><th>Correo</th><th>Estado Octubre</th><th>Folio</th></tr>
              </thead>
              <tbody>
                {vecinos.map(v => {
                  const p = pagosOctubre.find(pg => pg.usuarioId === v.id);
                  return (
                    <tr key={v.id}>
                      <td><strong>{v.vivienda}</strong></td>
                      <td>{v.nombre}</td>
                      <td>{v.correo}</td>
                      <td>
                        <span style={{ fontSize: '11px', padding: '3px 8px', borderRadius: '12px', fontWeight: 'bold', background: p ? '#DCFCE7' : '#FEE2E2', color: p ? '#166534' : '#991B1B' }}>
                          {p ? '✅ Al corriente' : '❌ Adeudo'}
                        </span>
                      </td>
                      <td>{p ? <code>{p.referencia}</code> : <span style={{ color: '#94A3B8' }}>Sin pago</span>}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // Componente Emergencias SOS
    function DirectorioSOS({ emergencias }) {
      return (
        <div className="modulo-sos">
          <div className="card-seccion">
            <div className="card-header">
              <h2>🚨 Directorio Telefónico de Emergencias (US-005)</h2>
              <span className="badge-sprint">Zapopan, Jalisco</span>
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(240px, 1fr))', gap: '12px', marginTop: '16px' }}>
              {emergencias.map(item => (
                <div key={item.id} style={{ padding: '14px', background: '#FFFFFF', border: '1px solid #E2E8F0', borderRadius: '8px', display: 'flex', alignItems: 'center', gap: '12px' }}>
                  <div style={{ fontSize: '28px' }}>{item.icono}</div>
                  <div>
                    <h4 style={{ margin: 0, fontSize: '14px', color: '#1E293B' }}>{item.nombre}</h4>
                    <a href={`tel:${item.telefono}`} style={{ color: '#1D4ED8', fontWeight: 'bold', fontSize: '13px' }}>
                      📞 {item.telefono}
                    </a>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // Componente Raíz de la Aplicación
    function App() {
      const [usuarios, setUsuarios] = useState(() => {
        const g = localStorage.getItem('lr_usuarios_v2');
        return g ? JSON.parse(g) : DATOS_INICIALES.usuarios;
      });
      const [pagos, setPagos] = useState(() => {
        const g = localStorage.getItem('lr_pagos_v2');
        return g ? JSON.parse(g) : DATOS_INICIALES.pagos;
      });
      const [avisos, setAvisos] = useState(() => {
        const g = localStorage.getItem('lr_avisos_v2');
        return g ? JSON.parse(g) : DATOS_INICIALES.avisos;
      });
      const [fallas, setFallas] = useState(() => {
        const g = localStorage.getItem('lr_fallas_v2');
        return g ? JSON.parse(g) : DATOS_INICIALES.fallas;
      });
      const [usuarioActual, setUsuarioActual] = useState(() => {
        const s = sessionStorage.getItem('lr_sesion_v2');
        return s ? JSON.parse(s) : null;
      });
      const [vista, setVista] = useState('inicio');

      useEffect(() => { localStorage.setItem('lr_usuarios_v2', JSON.stringify(usuarios)); }, [usuarios]);
      useEffect(() => { localStorage.setItem('lr_pagos_v2', JSON.stringify(pagos)); }, [pagos]);
      useEffect(() => { localStorage.setItem('lr_avisos_v2', JSON.stringify(avisos)); }, [avisos]);
      useEffect(() => { localStorage.setItem('lr_fallas_v2', JSON.stringify(fallas)); }, [fallas]);

      const handleLogin = (user) => {
        setUsuarioActual(user);
        sessionStorage.setItem('lr_sesion_v2', JSON.stringify(user));
        setVista('inicio');
      };

      const handleLogout = () => {
        setUsuarioActual(null);
        sessionStorage.removeItem('lr_sesion_v2');
        setVista('inicio');
      };

      if (!usuarioActual) {
        return <Login usuarios={usuarios} onLogin={handleLogin} />;
      }

      const esAdmin = usuarioActual.tipo === 'admin';

      return (
        <div className="app-container">
          <header className="navbar-superior">
            <div className="navbar-brand">
              <span className="logo-icono">🏘️</span>
              <div>
                <h1>Residencial Los Robles</h1>
                <span className="subtitulo-navbar">Zapopan, Jalisco · PWA React 18</span>
              </div>
            </div>
            <div className="navbar-usuario">
              <div className="badge-usuario">
                <strong>{usuarioActual.nombre}</strong>
                <span className="rol-tag">{esAdmin ? `👔 ${usuarioActual.cargo}` : `🏠 ${usuarioActual.vivienda}`}</span>
              </div>
              <button className="btn-logout" onClick={handleLogout}>🚪 Salir</button>
            </div>
          </header>

          <nav className="menu-navegacion">
            <button className={`nav-tab ${vista === 'inicio' ? 'activo' : ''}`} onClick={() => setVista('inicio')}>
              {esAdmin ? '📊 Panel Financiero' : '🏠 Inicio'}
            </button>
            {!esAdmin && (
              <button className={`nav-tab ${vista === 'pagos' ? 'activo' : ''}`} onClick={() => setVista('pagos')}>
                💳 Pagar Cuota (US-003)
              </button>
            )}
            <button className={`nav-tab ${vista === 'avisos' ? 'activo' : ''}`} onClick={() => setVista('avisos')}>
              📢 Tablón de Avisos (US-006)
            </button>
            <button className={`nav-tab ${vista === 'fallas' ? 'activo' : ''}`} onClick={() => setVista('fallas')}>
              🛠️ Reportes de Fallas (US-008)
            </button>
            <button className={`nav-tab ${vista === 'sos' ? 'activo' : ''}`} onClick={() => setVista('sos')}>
              🚨 Directorio SOS
            </button>
          </nav>

          <main className="main-content">
            {vista === 'inicio' && (
              esAdmin ? (
                <DashboardAdmin usuario={usuarioActual} usuarios={usuarios} pagos={pagos} onNavegar={setVista} />
              ) : (
                <DashboardVecino usuario={usuarioActual} pagos={pagos} avisos={avisos} fallas={fallas} onNavegar={setVista} />
              )
            )}
            {vista === 'pagos' && !esAdmin && (
              <PagoCuotas usuario={usuarioActual} pagos={pagos} onRegistrarPago={(p) => setPagos([p, ...pagos])} />
            )}
            {vista === 'avisos' && (
              <TablonAvisos usuario={usuarioActual} avisos={avisos} onPublicarAviso={(a) => setAvisos([a, ...avisos])} />
            )}
            {vista === 'fallas' && (
              <ReporteFallas usuario={usuarioActual} fallas={fallas} onRegistrarFalla={(f) => setFallas([f, ...fallas])} />
            )}
            {vista === 'sos' && (
              <DirectorioSOS emergencias={DATOS_INICIALES.emergencias} />
            )}
          </main>

          <footer className="footer-app">
            <p>Residencial Los Robles PWA · Sprint 2 (React 18 & Scrum) · Universidad de Guadalajara</p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
